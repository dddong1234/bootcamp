<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: repeat(4,200px);
            grid-template-areas: 
                "img1 img3 img3"
                "img1 img4 img6"
                "img2 img2 img6"
                "img5 img5 img5"
            ;
            gap: 8px;
            padding: 10%
            
            
        }
        .img1{
            grid-area: img1;
        }
        .img2{
            grid-area: img2;
        }
        .img3{
            grid-area: img3;
        }
        .img4{
            grid-area: img4;
        }
        .img5{
            grid-area: img5;
        }
        .img6{
            grid-area: img6;
        }
        
        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        
        .container:hover .item img:not(:hover){
            filter: grayscale(1);
            opacity: 0.5;
        }
    </style>
</head>
<body>
  <div class="container">
    <div class="item img1"><img 
            src="https://images.unsplash.com/photo-1777873167728-b0d09526d3c8?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxMnx8fGVufDB8fHx8fA%3D%3D" >
    </div>
    <div class="item img2"><img 
            src="https://plus.unsplash.com/premium_photo-1783332342591-888d7d97d6c4?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxNHx8fGVufDB8fHx8fA%3D%3D" >
    </div>
    <div class="item img3"><img 
            src="https://images.unsplash.com/photo-1782229296900-2511950b8fda?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxN3x8fGVufDB8fHx8fA%3D%3D" >
    </div>
    <div class="item img4"><img 
            src="https://images.unsplash.com/photo-1782730766040-8f5f0b02d9d7?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyMHx8fGVufDB8fHx8fA%3D%3D" >
    </div>
    <div class="item img5"><img 
            src="https://images.unsplash.com/photo-1781376621620-02e8e6b83399?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyNXx8fGVufDB8fHx8fA%3D%3D" >
    </div>
    <div class="item img6"><img 
            src="https://images.unsplash.com/photo-1783675951657-17a0e9678b5c?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzMXx8fGVufDB8fHx8fA%3D%3D" >
    </div>
  </div>
</body>
</html>
